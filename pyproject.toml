[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "anydes"
version = "0.1.0"
description = "Anydes, a local-first cognitive companion runtime."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "cryptography==49.0.0",
    "PySide6==6.8.3",
    "pywin32==312; platform_system == 'Windows'",
]

[project.optional-dependencies]
ai = [
    "openai==2.0.0",
]
voice = [
    "certifi==2024.12.14",
    "edge-tts==6.1.12",
    "pygame==2.6.1",
    "piper-tts==1.4.2",
    "sounddevice==0.5.1",
    "soundfile==0.13.1",
    "vosk==0.3.45",
]
vision = [
    "mss==10.0.0",
    "numpy==2.1.3",
    "opencv-python==4.10.0.84",
    "Pillow==11.1.0",
]

[project.scripts]
anydes = "anydes.interfaz.pyside_companion.app:main"
anydes-voice = "anydes.voz.session:main"
anydes-evaluate = "anydes.evaluation.cli:main"

[tool.setuptools]
package-dir = {"" = "programa_principal"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["programa_principal"]
include = ["anydes*"]

[tool.setuptools.package-data]
"anydes.interfaz.pyside_companion" = [
    "assets/*.png",
    "vrm_stage/*.html",
    "vrm_stage/*.css",
    "vrm_stage/*.js",
    "vrm_stage/vendor/*.js",
    "vrm_stage/vendor/*.txt",
    "vrm_stage/utils/*.js",
]
"anydes.personalidad" = ["prompt_principal.md", "perfil_visual.md", "perfil_voz.md"]
"anydes.voz" = ["scripts/*.ps1"]
